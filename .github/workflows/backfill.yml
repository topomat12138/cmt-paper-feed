name: Historical arXiv backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: First legacy file date (YYYY-MM-DD)
        type: string
        default: '2026-04-11'
        required: true
      end:
        description: Last legacy file date (YYYY-MM-DD)
        type: string
        default: '2026-10-27'
        required: true

permissions:
  contents: write

concurrency:
  group: cmt-paper-feed-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked runtime
        run: uv sync --locked --no-dev
      - name: Prepare isolated data checkout
        env:
          FEED_GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m feed.workflow checkout --directory "$RUNNER_TEMP/feed-data"
      - name: Clone raw legacy data
        run: uv run --no-sync python -m feed.workflow legacy --directory "$RUNNER_TEMP/legacy-data"
      - name: Import historical records
        id: backfill
        continue-on-error: true
        env:
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
        run: |
          uv run --no-sync feed backfill --source-dir "$RUNNER_TEMP/legacy-data" --data-dir "$RUNNER_TEMP/feed-data" --start "$START_DATE" --end "$END_DATE" > "$RUNNER_TEMP/feed-backfill.json"
      - name: Summarize historical import
        if: ${{ !cancelled() && (steps.backfill.outcome == 'success' || steps.backfill.outcome == 'failure') }}
        run: |
          {
            printf '### Historical import report\n\n'
            if [[ -s "$RUNNER_TEMP/feed-backfill.json" ]]; then
              printf '```json\n'
              cat "$RUNNER_TEMP/feed-backfill.json"
              printf '\n```\n'
            else
              printf 'No JSON report was produced. See step errors above.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish changed historical shards
        if: ${{ !cancelled() && (steps.backfill.outcome == 'success' || steps.backfill.outcome == 'failure') }}
        env:
          FEED_GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m feed.workflow publish --directory "$RUNNER_TEMP/feed-data" --report "$RUNNER_TEMP/feed-backfill.json" --kind backfill
      - name: Mark incomplete backfill as failed
        if: ${{ !cancelled() && steps.backfill.outcome == 'failure' }}
        run: exit 1
