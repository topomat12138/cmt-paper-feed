[project]
name = "cmt-paper-feed"
version = "0.1.0"
description = "Public, source-neutral paper metadata for downstream research tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
