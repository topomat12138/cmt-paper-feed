[project]
name = "cmt-paper-feed"
version = "0.1.0"
description = "Public, source-neutral paper metadata for downstream research tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "pyyaml>=6,<7"]

[project.optional-dependencies]
embed = [
    "numpy>=2,<3",
    "pyarrow>=19,<25",
    "torch>=2.8,<2.9",
    "transformers>=4.57,<5",
    "sentence-transformers>=5.2,<6",
    "peft>=0.15.2,<1",
]

[project.scripts]
feed = "feed.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "numpy>=2,<3", "pyarrow>=19,<25"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["model_smoke: opt-in real model test; skipped unless explicitly enabled"]
